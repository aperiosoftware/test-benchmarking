# .github/workflows/benchmark.yml
#
# Runs asv on the self-hosted benchmark box. On pull requests carrying the
# `run-benchmarks` label the PR head is benchmarked and compared against the PR
# base; on pushes to main the latest commit is benchmarked on its own.
name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions: {}

jobs:
  benchmark:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-benchmarks')
    runs-on: [self-hosted, benchmark]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:

      - uses: actions/checkout@v7
        with:
          # Benchmark the actual PR head rather than the synthetic merge commit,
          # and fetch full history so the base commit is available to asv.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install asv

      - name: Machine config
        run: asv machine --yes

      - name: Warm up
        run: asv run --quick --show-stderr HEAD^!

      - name: Run benchmarks
        run: asv run --interleave-rounds --show-stderr HEAD^!

      - name: Compare against base
        if: github.event_name == 'pull_request'
        run: |
          asv run --interleave-rounds --show-stderr ${{ github.event.pull_request.base.sha }}^!
          asv compare ${{ github.event.pull_request.base.sha }} HEAD | tee compare.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            compare.txt
            .asv/results
          if-no-files-found: ignore
