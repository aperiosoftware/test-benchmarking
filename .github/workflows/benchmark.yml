# .github/workflows/benchmark.yml  (in astropy/astropy, on main)
#
# Runs asv on the self-hosted benchmark box when a maintainer applies the
# `run-benchmarks` label. pull_request_target means THIS file comes from main,
# so a PR cannot change the gate or the runner it targets.
name: Benchmarks

on:
  push:
  workflow_dispatch:

permissions: {}

jobs:
  benchmark:
    runs-on: [self-hosted, benchmark]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:


      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7

      - name: Install dependencies
        run: pip install asv

      - name: Warm up
        run: asv run --quick --show-stderr HEAD^!

      - name: Run benchmarks
        run: asv run --interleave-rounds --show-stderr HEAD^!

      - name: Compare against base
        run: |
          asv run --quick ${{ github.event.pull_request.base.sha }}^!
          asv compare ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > compare.txt
          cat compare.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            compare.txt
            .asv/results
